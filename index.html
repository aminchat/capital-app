<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0f17">
<meta name="description" content="برنامه مدیریت سرمایه و خرج به روش چهار پاکت">
<title>مدیریت سرمایه</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0b0f17;
  --bg2:#0e1420;
  --card:#141b29;
  --card2:#1b2435;
  --border:#243044;
  --text:#e9eff8;
  --muted:#8b98ab;
  --accent:#3d8bfd;
  --green:#22c55e;
  --red:#ef4444;
  --orange:#f59e0b;
  --purple:#a78bfa;
  --blue:#3d8bfd;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Vazirmatn,sans-serif;
  line-height:1.6;
  padding-bottom:86px;
  min-height:100vh;
}
h1,h2,h3,h4{margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;color:var(--text)}

/* header */
header{
  position:sticky;top:0;z-index:30;
  background:rgba(11,15,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,#3d8bfd,#7c3aed);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.brand b{font-size:16px;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-3px}

/* layout */
main{max-width:560px;margin:0 auto;padding:16px 16px 30px}
section{display:none;animation:fade .2s ease}
section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* cards */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}
.card h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1;min-width:120px}

/* stat tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:14px;
}
.stat .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat .val{font-size:19px;font-weight:800;letter-spacing:.3px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:4px}
.val.green{color:var(--green)}
.val.red{color:var(--red)}
.val.accent{color:var(--accent)}
.val.orange{color:var(--orange)}

/* progress */
.pbar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.pbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,#3d8bfd,#22c55e);transition:width .4s}
.pbar>div.over{background:linear-gradient(90deg,#f59e0b,#ef4444)}

/* buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--card2);color:var(--text);
  border:1px solid var(--border);border-radius:12px;
  padding:11px 16px;font-size:14px;font-weight:600;
  transition:.15s;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:active{background:#2f76e8}
.btn.danger{background:transparent;border-color:#4a2530;color:var(--red)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

/* segmented */
.seg{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.seg button.on.out{background:var(--red)}

/* inputs */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
.input{
  width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:12px 13px;font-size:15px;outline:none;transition:.15s;
}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px}
select.input{appearance:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:9px 13px;border-radius:99px;font-size:13px;font-weight:600;
  background:var(--card2);border:1px solid var(--border);color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;
}
.chip.on{color:#fff;border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* list */
.item{
  display:flex;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:13px;margin-bottom:9px;
}
.item .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.item .mid{flex:1;min-width:0}
.item .t1{font-size:14px;font-weight:700}
.item .t2{font-size:11.5px;color:var(--muted);margin-top:2px}
.item .amt{font-size:14px;font-weight:800;white-space:nowrap}
.item .amt.in{color:var(--green)}
.item .amt.out{color:var(--red)}
.badge{font-size:10.5px;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--border);color:var(--muted);display:inline-block}

/* bottom nav */
nav{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(11,15,23,.95);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  display:flex;justify-content:space-around;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));
}
nav button{
  background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:10px;flex:1;
}
nav button .ni{font-size:21px;line-height:1}
nav button.on{color:var(--accent)}

/* fab */
#fab{
  position:fixed;bottom:86px;left:18px;z-index:29;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#3d8bfd,#22c55e);
  color:#fff;font-size:27px;font-weight:400;
  box-shadow:0 8px 22px rgba(34,197,94,.35);
  display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
#fab:active{transform:scale(.9)}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav .mttl{font-size:15px;font-weight:800;text-align:center}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:18px}

/* modal */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
  display:none;align-items:flex-end;justify-content:center;
}
.overlay.show{display:flex}
.sheet{
  background:var(--card);border:1px solid var(--border);border-bottom:none;
  border-radius:22px 22px 0 0;width:100%;max-width:560px;
  max-height:92vh;overflow-y:auto;
  padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  animation:slide .25s ease;
}
@keyframes slide{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sheet .handle{width:44px;height:5px;background:var(--border);border-radius:99px;margin:0 auto 14px}
.sheet h2{font-size:17px;margin-bottom:14px}
.sheet .x{position:absolute;top:16px;left:16px;background:var(--card2);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;font-size:16px;color:var(--muted)}

/* pie legend */
.legend{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.legend .lr{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .lr .sw{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.legend .lr .nm{flex:1;color:var(--muted)}
.legend .lr .pv{font-weight:700}
.legend .lr .pg{color:var(--muted);font-size:12px;width:74px;text-align:left}

/* target bars */
.tbar{display:flex;flex-direction:column;gap:10px}
.tbar .tr .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.tbar .tr .top .n{font-weight:600}
.tbar .tr .top .p{color:var(--muted)}
.tbar .bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.tbar .bar>div{height:100%;border-radius:99px}
.tmark{position:relative}

/* banner */
.banner{
  background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(239,68,68,.12));
  border:1px solid rgba(245,158,11,.35);border-radius:14px;
  padding:12px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;
}
.banner.warn{background:linear-gradient(135deg,rgba(245,158,11,.14),rgba(245,158,11,.08));border-color:rgba(245,158,11,.35)}
.pill{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;
  background:var(--card2);border:1px solid var(--border);color:var(--muted);
}
.pill.prev{color:var(--purple);border-color:rgba(167,139,250,.4)}
.pill.waste{color:var(--red);border-color:rgba(239,68,68,.4)}

.muted{color:var(--muted)}
.small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:13.5px}
.empty .em{font-size:40px;display:block;margin-bottom:8px}
.divider{height:1px;background:var(--border);margin:12px 0}
.hint{font-size:11.5px;color:var(--muted);background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:9px 11px;margin-top:8px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">💰</div>
    <div>
      <b>مدیریت سرمایه</b>
      <small id="todayLbl">—</small>
    </div>
  </div>
</header>

<main>
  <!-- ============ DASHBOARD ============ -->
  <section id="tab-home" class="active">
    <div id="homeContent"></div>
  </section>

  <!-- ============ TRANSACTIONS ============ -->
  <section id="tab-tx">
    <div id="txContent"></div>
  </section>

  <!-- ============ REPORT ============ -->
  <section id="tab-report">
    <div id="reportContent"></div>
  </section>

  <!-- ============ INVESTMENTS ============ -->
  <section id="tab-invest">
    <div id="investContent"></div>
  </section>

  <!-- ============ ACCOUNTS ============ -->
  <section id="tab-accounts">
    <div id="accountsContent"></div>
  </section>
</main>

<button id="fab" title="تراکنش جدید">+</button>

<nav id="nav"></nav>

<!-- modal -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";
/* ============================= UTILS ============================= */
const FA='۰۱۲۳۴۵۶۷۸۹';
function toFa(n){return String(n).replace(/\d/g,d=>FA[d]);}
function fmt(n){n=Math.round(Number(n)||0);const s=Math.abs(n).toLocaleString('en-US');return (n<0?'−':'')+toFa(s);}
function fmtT(n){return fmt(n)+' تومان';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* storage wrapper (graceful in sandboxed preview) */
const store=(()=>{
  let mem={},ok=false;
  try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true;}catch(e){ok=false;}
  return {
    get(k){try{return ok?localStorage.getItem(k):(mem[k]??null);}catch(e){return mem[k]??null;}},
    set(k,v){try{if(ok)localStorage.setItem(k,v);else mem[k]=v;}catch(e){mem[k]=v;}},
    persisted:ok
  };
})();

/* ============================= JALALI ============================= */
function toJalali(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy=(gy<=1600)?0:979;
  gy-=(gy<=1600)?621:1600;
  const gy2=(gm>2)?(gy+1):gy;
  let days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*Math.floor(days/12053);days%=12053;
  jy+=4*Math.floor(days/1461);days%=1461;
  jy+=Math.floor((days-1)/365);
  if(days>365)days=(days-1)%365;
  const jm=(days<186)?1+Math.floor(days/31):7+Math.floor((days-186)/30);
  const jd=1+((days<186)?(days%31):((days-186)%30));
  return [jy,jm,jd];
}
function jalaliNow(){const d=new Date();return toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());}
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function curMonthKey(){const[y,m]=jalaliNow();return y+'/'+String(m).padStart(2,'0');}
function shiftMonth(key,delta){let[y,m]=key.split('/').map(Number);m+=delta;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'/'+String(m).padStart(2,'0');}
function monthLabel(key){const[y,m]=key.split('/');return MONTHS[(+m)-1]+' '+toFa(y);}
function fmtDate(iso){if(!iso)return'';const[y,m,d]=iso.split('-').map(Number);const[jy,jm,jd]=toJalali(y,m,d);return toFa(jd)+' '+MONTHS[jm-1]+' '+toFa(jy);}
function monthOfISO(iso){if(!iso)return curMonthKey();const[y,m,d]=iso.split('-').map(Number);const[jy,jm]=toJalali(y,m,d);return jy+'/'+String(jm).padStart(2,'0');}

/* ============================= STATE ============================= */
const KEY='capital_app_v1';
function defaultState(){
  return {accounts:[],transactions:[],investments:[],budgets:{},rates:{}};
}
let state=(()=>{try{const s=store.get(KEY);if(s)return Object.assign(defaultState(),JSON.parse(s));}catch(e){}return defaultState();})();
function save(){store.set(KEY,JSON.stringify(state));scheduleSync();}

/* ============================= DATA ============================= */
const CATS=[
  {id:'need',    label:'ضروریات',     color:'#3d8bfd', target:60, emoji:'🏠'},
  {id:'invest',  label:'سرمایه‌گذاری', color:'#22c55e', target:20, emoji:'📈'},
  {id:'fun',     label:'تفریح',       color:'#f59e0b', target:15, emoji:'🎮'},
  {id:'charity', label:'نیکوکاری',    color:'#a78bfa', target:5,  emoji:'🤲'},
  {id:'waste',   label:'هدررفت',      color:'#ef4444', target:0,  emoji:'🚨'},
];
const catById=id=>CATS.find(c=>c.id===id);
const ACCT_TYPES=['کارت بانکی','نقدی','ارز دیجیتال','کیف پول آنلاین','سایر'];
const CURRENCIES=['تومان','دلار','یورو','درهم','لیر','پوند','تتر','سایر'];

function accountById(id){return state.accounts.find(a=>a.id===id);}
function rateOf(cur){return (cur==='تومان'||!cur)?1:(state.rates[cur]||0);}
function accountCurrent(a){
  let b=a.initial||0;
  for(const t of state.transactions){
    if(t.accountId!==a.id)continue;
    b+= (t.type==='in'||t.type==='transferIn')? t.amount : -t.amount;
  }
  return b;
}
function accountCurrentToman(a){return accountCurrent(a)*rateOf(a.currency);}
function cashTotal(){return state.accounts.reduce((s,a)=>s+accountCurrentToman(a),0);}
function investValue(inv){return (inv.qty||0)*(inv.cur||0);}
function investValueToman(inv){return investValue(inv)*rateOf(inv.currency);}
function investTotal(){return state.investments.reduce((s,i)=>s+investValueToman(i),0);}
function investProfit(inv){return investValue(inv)-((inv.qty||0)*(inv.buy||0));}

function spentIn(mk){return state.transactions.filter(t=>t.month===mk&&t.type==='out').reduce((s,t)=>s+t.amount,0);}
function incomeIn(mk){return state.transactions.filter(t=>t.month===mk&&t.type==='in').reduce((s,t)=>s+t.amount,0);}
function isTransfer(t){return t.type==='transferIn'||t.type==='transferOut';}

function allMonthKeys(){
  const set=new Set([curMonthKey()]);
  for(const t of state.transactions)set.add(t.month);
  for(const k of Object.keys(state.budgets))set.add(k);
  return [...set].sort();
}
function computeMonths(){
  const keys=allMonthKeys();let carried=0;const res={};
  for(const k of keys){
    const budget=(state.budgets[k]&&state.budgets[k].amount)||0;
    const spent=spentIn(k),income=incomeIn(k);
    const available=budget+carried;
    const remaining=available-spent;
    res[k]={budget,carriedIn:carried,spent,income,available,remaining};
    carried=remaining>0?remaining:0;
  }
  return res;
}
function curStats(){return computeMonths()[curMonthKey()]||{budget:0,carriedIn:0,spent:0,income:0,available:0,remaining:0};}

/* ============================= MODAL ============================= */
const overlay=document.getElementById('overlay');
const sheet=document.getElementById('sheet');
function openModal(html){sheet.innerHTML='<div class="handle"></div>'+html;overlay.classList.add('show');}
function closeModal(){overlay.classList.remove('show');}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});

function askConfirm(msg,onYes){
  openModal(`
    <div style="text-align:center;padding:10px 4px">
      <div style="font-size:38px;margin-bottom:10px">🗑️</div>
      <p style="font-size:15px;margin:0 0 18px">${msg}</p>
      <div class="row">
        <button class="btn" style="flex:1" onclick="closeModal()">انصراف</button>
        <button class="btn danger" style="flex:1" id="cfYes">بله، حذف کن</button>
      </div>
    </div>`);
  document.getElementById('cfYes').onclick=()=>{closeModal();onYes();};
}

/* ============================= TRANSACTION FORM ============================= */
let editingTxId=null;
function openTxForm(tx){
  editingTxId=tx?tx.id:null;
  const isEdit=!!tx;
  const type=tx?tx.type:'out';
  const today=new Date();
  const todayISO=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  if(state.accounts.length===0){
    openModal(`
      <h2>ابتدا یک حساب بساز</h2>
      <div class="empty"><span class="em">💳</span>برای ثبت تراکنش باید حداقل یک حساب یا کارت تعریف کنی.</div>
      <button class="btn primary block" onclick="closeModal();switchTab('accounts');openAccountForm()">ساخت حساب</button>`);
    return;
  }
  const acctOpts=state.accounts.map(a=>`<option value="${a.id}" ${(!tx&&a.id===state.accounts[0].id)||(tx&&tx.accountId===a.id)?'selected':''}>${esc(a.name)}</option>`).join('');
  const catChips=CATS.map(c=>`
    <button type="button" class="chip ${tx&&tx.cat===c.id?'on':(!tx&&c.id==='need')?'on':''}" data-cat="${c.id}"
      style="${(!tx&&c.id==='need')||(tx&&tx.cat===c.id)?'background:'+c.color:''}"
      onclick="setTxCat(this)">
      <span class="dot"></span>${c.emoji} ${c.label}
    </button>`).join('');
  openModal(`
    <button class="x" onclick="closeModal()">✕</button>
    <h2>${isEdit?'ویرایش تراکنش':'تراکنش جدید'}</h2>
    <div class="seg" id="txTypeSeg" style="margin-bottom:14px">
      <button class="${type==='out'?'on out':''}" data-t="out" onclick="setTxType(this)">خرج −</button>
      <button class="${type==='in'?'on':''}" data-t="in" onclick="setTxType(this)">درآمد +</button>
    </div>
    <div class="field"><label>مبلغ (تومان)</label>
      <input class="input" id="txAmount" type="number" inputmode="decimal" min="0" placeholder="مثلاً ۲۵۰۰۰۰" value="${tx?tx.amount:''}">
    </div>
    <div class="field"><label>از کدام حساب؟</label>
      <select class="input" id="txAccount">${acctOpts}</select>
    </div>
    <div class="field" id="txCatWrap" style="${type==='in'?'display:none':''}">
      <label>دسته‌بندی خرج</label>
      <div class="chips" id="txCats">${catChips}</div>
    </div>
    <div class="field" id="txReflectWrap" style="display:none">
      <label>🤔 اگر این خرج را نمی‌کردی، چه می‌شد؟</label>
      <textarea class="input" id="txReflect" placeholder="مثلاً: می‌توانستم همان پول را پس‌انداز کنم...">${tx&&tx.reflect?esc(tx.reflect):''}</textarea>
    </div>

/* ============================= PIE CHART ============================= */
function pieSVG(slices,size){
  size=size||180;
  const cx=size/2,cy=size/2,r=size/2-6;
  const total=slices.reduce((s,x)=>s+x.v,0);
  if(total<=0)return `<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#1b2435"/><text x="${cx}" y="${cy}" fill="#8b98ab" font-size="13" text-anchor="middle" dominant-baseline="middle">بدون داده</text></svg>`;
  let a=-Math.PI/2;
  let paths='';
  for(const s of slices){
    if(s.v<=0)continue;
    const sweep=(s.v/total)*Math.PI*2;
    const x0=cx+r*Math.cos(a),y0=cy+r*Math.sin(a);
    const a1=a+sweep;
    const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const large=sweep>Math.PI?1:0;
    paths+=`<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${s.color}"/>`;
    a=a1;
  }
  return `<svg width="${size}" height="${size}" style="display:block;margin:0 auto">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.55}" fill="#141b29"/></svg>`;
}

function updateTransferPreview(){
  const from=accountById(document.getElementById('trFrom').value), to=accountById(document.getElementById('trTo').value);
  const amount=parseFloat(document.getElementById('trAmount').value)||0, box=document.getElementById('trPreview');
  if(!from||!to||!amount){box.textContent='مبلغ حساب مقصد بعد از تبدیل اینجا نمایش داده می‌شود.';return;}
  const toman=amount*rateOf(from.currency), dest=toman/rateOf(to.currency);
  box.innerHTML=`ارزش انتقال: <b>${fmt(toman)} تومان</b><br>واریز به مقصد: <b>${fmt(dest)} ${esc(to.currency)}</b>${from.currency!=='تومان'||to.currency!=='تومان'?`<br><span class="small muted">نرخ ${esc(from.currency)}: ${fmt(rateOf(from.currency))} تومان · نرخ ${esc(to.currency)}: ${fmt(rateOf(to.currency))} تومان</span>`:''}`;

function saveTransfer(){
  const from=document.getElementById('trFrom').value, to=document.getElementById('trTo').value;
  const amount=parseFloat(document.getElementById('trAmount').value);
  if(from===to){toast('حساب مبدأ و مقصد باید متفاوت باشند');return;}
  if(!amount||amount<=0){toast('مبلغ معتبر وارد کن');return;}
  const fromAcct=accountById(from), toAcct=accountById(to), fromRate=rateOf(fromAcct.currency), toRate=rateOf(toAcct.currency);
  if(!fromRate||!toRate){toast('نرخ ارز مبدأ یا مقصد را در بخش حساب‌ها ثبت کن');return;}
  const destinationAmount=amount*fromRate/toRate;
  const dateISO=document.getElementById('trDate').value||new Date().toISOString().slice(0,10), month=monthOfISO(dateISO), pair=uid();
  const note=document.getElementById('trNote').value.trim();
  state.transactions.push({id:uid(),pair,amount,accountId:from,note,dateISO,month,type:'transferOut',cat:null});
  state.transactions.push({id:uid(),pair,amount:destinationAmount,accountId:to,note:note||'انتقال بین حساب‌ها',dateISO,month,type:'transferIn',cat:null});
  save();closeModal();render();toast('انتقال با موفقیت ثبت شد ✓');
}
function saveRateFrom(cur){

/* ============================= GOOGLE SYNC ============================= */
const GOOGLE_CLIENT_ID='802769209005-v1jiuetctp8u8lr5su697fafdqhe80oc.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME='capital-app-data.json';
let gUser=null;
let gToken=null;
let tokenClient=null;

function decodeJWT(tok){
  const b64=tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  const pad=b64+('==='.slice((b64.length+3)%4));
  return JSON.parse(atob(pad));
}
function setSignedIn(u){gUser=u;store.set('g_user',JSON.stringify(u));store.set('g_signed','1');}
function clearSignedIn(){gUser=null;gToken=null;store.set('g_user','');store.set('g_signed','0');}

function handleCredential(resp){
  try{
    const p=decodeJWT(resp.credential);
    setSignedIn({name:p.name,email:p.email,picture:p.picture||''});
  }catch(e){}
  requestAccessToken(function(ok){
    if(!ok){toast('نتوانستم به درایو دسترسی بگیرم');render();return;}
    loadFromDrive(function(){render();toast('ورود موفق ✓ همگام‌سازی فعال شد');});
  });
}

function requestAccessToken(cb){
  const done=function(ok){if(cb)cb(ok);};
  if(typeof google==='undefined'||!google.accounts){done(false);return;}
  if(!tokenClient){
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:DRIVE_SCOPE,
      callback:function(resp){
        if(resp&&resp.error){done(false);return;}
        gToken={token:resp.access_token,exp:Date.now()+((resp.expires_in||3600)*1000)};
        done(true);
      }
    });
  }
  if(gToken&&gToken.exp>Date.now()+60000){done(true);return;}
  tokenClient.requestAccessToken({prompt:''});
}

function googleSignIn(){
  if(typeof google==='undefined'||!google.accounts){toast('در حال بارگذاری گوگل…');return;}
  if(!window._gbtn){
    window._gbtn=document.createElement('div');
    window._gbtn.style.display='none';
    document.body.appendChild(window._gbtn);
    google.accounts.id.renderButton(window._gbtn,{theme:'outline',size:'large',text:'signin_with'});
  }
  const b=window._gbtn.querySelector('div[role=button]');
  if(b)b.click();
}
function googleSignOut(){
  clearSignedIn();
  if(typeof google!=='undefined'&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();
  render();toast('از حساب خارج شدی');
}

function driveFetch(url,opts){
  opts=opts||{};opts.headers=opts.headers||{};
  opts.headers.Authorization='Bearer '+gToken.token;
  return fetch(url,opts).then(function(r){
    if(r.status===401){
      return new Promise(function(res){
        requestAccessToken(function(ok){
          if(!ok){res(r);return;}
          opts.headers.Authorization='Bearer '+gToken.token;
          res(fetch(url,opts));
        });
      });
    }
    return r;
  });
}
function driveFindFile(){
  const q="name='"+DRIVE_FILENAME+"' and trashed=false";
  return driveFetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&spaces=drive&fields=files(id,name)')
    .then(function(r){return r.json();}).then(function(d){return (d.files&&d.files[0])||null;});
}
function driveRead(id){return driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?alt=media').then(function(r){return r.text();});}
function driveCreate(content){
  return driveFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FILENAME,mimeType:'application/json'})})
    .then(function(r){return r.json();}).then(function(d){return driveUpdate(d.id,content);});
}
function driveUpdate(id,content){
  return driveFetch('https://www.googleapis.com/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
}

function hasLocalData(){
  return state.accounts.length||state.transactions.length||state.investments.length||Object.keys(state.budgets).length;
}
function hasRemoteData(r){
  return (r.accounts&&r.accounts.length)||(r.transactions&&r.transactions.length)||(r.investments&&r.investments.length)||Object.keys(r.budgets||{}).length;
}

function loadFromDrive(cb){
  cb=cb||function(){};
  if(!gToken){requestAccessToken(function(ok){if(ok)loadFromDrive(cb);else{toast('مجوز Google Drive داده نشد');cb();}});return;}
  driveFindFile().then(function(f){
    if(!f){
      driveCreate(JSON.stringify(state)).catch(function(){});
      cb();return;
    }
    return driveRead(f.id).then(function(text){
      try{
        const remote=JSON.parse(text);
        if(hasLocalData()&&!hasRemoteData(remote)){
          driveUpdate(f.id,JSON.stringify(state)).catch(function(){});
        }else{
          state=Object.assign(defaultState(),remote);
          save();
        }
      }catch(e){}
      cb();
    });
  }).catch(function(){toast('خطا در دریافت از درایو');cb();});
}

let syncTimer=null;
function scheduleSync(){
  if(!gToken)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushToDrive,1500);
}
function pushToDrive(){
  if(!gToken){requestAccessToken(function(ok){if(ok)pushToDrive();else toast('مجوز Google Drive داده نشد');});return;}
  const content=JSON.stringify(state);
  driveFindFile().then(function(f){
    if(f)return driveUpdate(f.id,content);
    return driveCreate(content);
  }).then(function(){/* synced */}).catch(function(){});
}

  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.update();
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;
      if(!w)return;
      w.addEventListener('statechange',()=>{
        if(w.state==='installed' && navigator.serviceWorker.controller){
          toast('نسخه جدید برنامه آماده شد؛ در حال به‌روزرسانی…');
          setTimeout(()=>location.reload(),1200);
        }
      });
    });
  }).catch(()=>{});
}
</script>
</body>
